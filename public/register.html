<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Auth Portal</title>
  <meta name="description" content="Secure User Registration Page with JavaScript Backend and SQL Database.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient Glow Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="app-container">
    <div class="auth-card" id="authCard">
      <!-- Back to Home Link -->
      <div class="back-home-wrapper">
        <a href="index.html" class="back-home-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Back to Home</span>
        </a>
      </div>

      <div class="card-header">
        <div class="brand-logo">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="19" y1="8" x2="19" y2="14"></line>
            <line x1="22" y1="11" x2="16" y2="11"></line>
          </svg>
        </div>
        <h1 class="brand-title">Create Account</h1>
        <p class="brand-subtitle">Join us today by filling in your details below</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="alert-box hidden" role="alert">
        <span class="alert-icon" id="alertIcon"></span>
        <span class="alert-message" id="alertMessage"></span>
      </div>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="registerName" placeholder="Alex Morgan" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="registerEmail" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="registerPassword" placeholder="Min. 6 characters" required autocomplete="new-password" oninput="checkPasswordStrength(this.value)">
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('registerPassword', this)" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <!-- Strength Bar -->
          <div class="strength-meter-container">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <span class="strength-text" id="strengthText">Password must be at least 6 characters</span>
        </div>

        <div class="form-group">
          <label for="registerConfirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <input type="password" id="registerConfirmPassword" placeholder="Repeat your password" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="agreeTerms" required>
            <span class="custom-checkbox"></span>
            <span class="checkbox-label">I agree to the <a href="#" class="terms-link">Terms &amp; Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="submit-btn" id="registerSubmitBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>

      <div class="switch-page-prompt">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>


    </div>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
